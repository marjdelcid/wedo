<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Menú · Marjorie & André</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&family=Marcellus+SC&family=Marcellus&family=EB+Garamond:ital@0;1&display=swap">
<style>
  /* =====================================================================
     Menú de 3 hojas troqueladas unidas por ojal metálico en la base
     (giran en abanico) + borla verde oliva:
       Hoja 1 · óvalo grande con el menú
       Hoja 2 · óvalo pequeño con el monograma sobre rayas
       Hoja 3 · tulipán troquelado a contorno
     Página: 130 × 190 mm por hoja. Sangrado: las hojas 1 y 2 llevan la
     silueta con 3 mm extra; la línea punteada vino es el troquel.
     El círculo pequeño con cruz es el OJAL (Ø 4 mm) en las tres hojas.
     Imprimir al 100%, sin márgenes, cartulina 300 g.
     ===================================================================== */
  @page{size:130mm 190mm; margin:0;}
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:#666;}
  .page{width:130mm; height:190mm; position:relative; overflow:hidden; page-break-after:always; margin:0 auto; background:#fff;}
  @media screen{ .page{margin:10mm auto; box-shadow:0 6px 30px rgba(0,0,0,.4);} }
  svg{display:block; width:130mm; height:190mm;}
  .script{font-family:'Monsieur La Doulaise',cursive;}
  .caps{font-family:'Marcellus SC',serif; text-transform:uppercase;}
  .body-it{font-family:'EB Garamond',serif; font-style:italic;}
  @media print{ html,body{background:#fff;} .page{box-shadow:none; margin:0;} .noprint{display:none;} }
  .noprint{position:fixed; top:8px; left:50%; transform:translateX(-50%); background:#231712; color:#F7F0E5; font:12px/1.5 system-ui; padding:8px 14px; border-radius:10px; z-index:99; max-width:92vw; text-align:center;}
</style>
</head>
<body>
<div class="noprint">Menú de 3 hojas que giran unidas por un ojal Ø 4 mm en la base (+ borla verde oliva) · 130×190 mm c/u · Imprimir al 100%, sin márgenes, cartulina 300 g · Punteado vino = troquel · La flor se corta a contorno con 2 mm de margen</div>

<!-- HOJA 1 · MENÚ (óvalo grande) -->
<div class="page">
  <svg viewBox="0 0 130 190" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="lino1" patternUnits="userSpaceOnUse" width="130" height="190">
        <image href="/am/tex/lino.webp" x="0" y="0" width="130" height="190" preserveAspectRatio="xMidYMid slice"/>
      </pattern>
    </defs>
    <!-- silueta con sangrado y troquel -->
    <ellipse cx="65" cy="95" rx="54" ry="85" fill="url(#lino1)"/>
    <ellipse cx="65" cy="95" rx="54" ry="85" fill="#F3EED7" opacity="0.55"/>
    <ellipse cx="65" cy="95" rx="51" ry="82" fill="none" stroke="#A15D66" stroke-width="0.25" stroke-dasharray="1.6 1.6"/>
    <ellipse cx="65" cy="95" rx="46.5" ry="77.5" fill="none" stroke="#C39B45" stroke-width="0.35"/>

    <text class="script" font-size="16" fill="#4A1D2B" x="65" y="42" text-anchor="middle">Menú</text>

    <text class="caps" font-size="3.1" letter-spacing="1.2" fill="#A15D66" x="65" y="58" text-anchor="middle">Entrada</text>
    <text class="body-it" font-size="4.2" fill="#4A1D2B" x="65" y="64" text-anchor="middle">Ensalada de la casa</text>
    <text class="body-it" font-size="2.9" fill="#A15D66" x="65" y="68.5" text-anchor="middle">queso de cabra, nuez caramelizada y vinagreta de miel</text>

    <line x1="57" y1="76" x2="73" y2="76" stroke="#C39B45" stroke-width="0.3"/>

    <text class="caps" font-size="3.1" letter-spacing="1.2" fill="#A15D66" x="65" y="85" text-anchor="middle">Plato fuerte</text>
    <text class="body-it" font-size="4.2" fill="#4A1D2B" x="65" y="91" text-anchor="middle">Medallón de res al vino tinto</text>
    <text class="body-it" font-size="2.9" fill="#A15D66" x="65" y="95.5" text-anchor="middle">puré trufado y vegetales rostizados</text>

    <line x1="57" y1="103" x2="73" y2="103" stroke="#C39B45" stroke-width="0.3"/>

    <text class="caps" font-size="3.1" letter-spacing="1.2" fill="#A15D66" x="65" y="112" text-anchor="middle">Postre</text>
    <text class="body-it" font-size="4.2" fill="#4A1D2B" x="65" y="118" text-anchor="middle">Pastel de bodas</text>
    <text class="body-it" font-size="2.9" fill="#A15D66" x="65" y="122.5" text-anchor="middle">con café de altura guatemalteco</text>

    <line x1="57" y1="130" x2="73" y2="130" stroke="#C39B45" stroke-width="0.3"/>

    <text class="caps" font-size="3.1" letter-spacing="1.2" fill="#A15D66" x="65" y="139" text-anchor="middle">Para brindar</text>
    <text class="body-it" font-size="3.4" fill="#4A1D2B" x="65" y="144.5" text-anchor="middle">vino tinto y blanco · espumante · coctelería</text>

    <text class="caps" font-size="2.6" letter-spacing="1" fill="#808249" x="65" y="158" text-anchor="middle">Marjorie &amp; André · 24.10.2026</text>

    <!-- ojal -->
    <circle cx="65" cy="168" r="2.2" fill="none" stroke="#A15D66" stroke-width="0.3" stroke-dasharray="0.8 0.8"/>
    <line x1="63.6" y1="168" x2="66.4" y2="168" stroke="#A15D66" stroke-width="0.2"/>
    <line x1="65" y1="166.6" x2="65" y2="169.4" stroke="#A15D66" stroke-width="0.2"/>
  </svg>
</div>

<!-- HOJA 2 · MONOGRAMA (óvalo pequeño sobre rayas) -->
<div class="page">
  <svg viewBox="0 0 130 190" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="rayas" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(35)">
        <rect width="4" height="4" fill="#F3EED7"/>
        <rect x="0" width="1.4" height="4" fill="#EDE4C8"/>
      </pattern>
    </defs>
    <ellipse cx="65" cy="102" rx="45" ry="69" fill="url(#rayas)"/>
    <ellipse cx="65" cy="102" rx="42" ry="66" fill="none" stroke="#A15D66" stroke-width="0.25" stroke-dasharray="1.6 1.6"/>
    <ellipse cx="65" cy="102" rx="38" ry="62" fill="none" stroke="#C39B45" stroke-width="0.3"/>

    <circle cx="65" cy="86" r="21" fill="#F3EED7"/>
    <circle cx="65" cy="86" r="21" fill="none" stroke="#808249" stroke-width="0.45"/>
    <circle cx="65" cy="86" r="19" fill="none" stroke="#C39B45" stroke-width="0.3"/>
    <image href="/am/logo/mono-dorado.png" x="50" y="71" width="30" height="30" preserveAspectRatio="xMidYMid meet"/>

    <text class="caps" font-size="2.8" letter-spacing="1.4" fill="#808249" x="65" y="122" text-anchor="middle">El Mayab · Guatemala</text>
    <text class="body-it" font-size="3.4" fill="#A15D66" x="65" y="129" text-anchor="middle">Gracias por acompañarnos</text>

    <circle cx="65" cy="158" r="2.2" fill="none" stroke="#A15D66" stroke-width="0.3" stroke-dasharray="0.8 0.8"/>
    <line x1="63.6" y1="158" x2="66.4" y2="158" stroke="#A15D66" stroke-width="0.2"/>
    <line x1="65" y1="156.6" x2="65" y2="159.4" stroke="#A15D66" stroke-width="0.2"/>
  </svg>
</div>

<!-- HOJA 3 · TULIPÁN (corte a contorno) -->
<div class="page">
  <svg viewBox="0 0 130 190" xmlns="http://www.w3.org/2000/svg">
    <g stroke-linejoin="round" stroke-linecap="round">
      <!-- tallo principal hasta el ojal -->
      <path d="M64,168 C62,140 60,110 58,84 C57.4,74 57.8,64 60,56" fill="none" stroke="#808249" stroke-width="3.6"/>
      <!-- tallo del capullo -->
      <path d="M63.4,120 C70,110 76,101 79,92" fill="none" stroke="#808249" stroke-width="2.6"/>
      <!-- hoja grande izquierda -->
      <path d="M62.8,150 C48,138 40,120 41,100 C52,112 60,126 63.6,142 Z" fill="#B9C287" stroke="#9AA46B" stroke-width="0.5"/>
      <!-- hoja derecha envolvente -->
      <path d="M63.2,146 C78,136 86,120 85,100 C74,110 66.5,124 63,140 Z" fill="#A9AE8F" stroke="#8E9370" stroke-width="0.5"/>
      <!-- hoja pequeña baja -->
      <path d="M63.8,160 C55,155 50,147 48.5,138 C56,142 61.5,149 63.8,156 Z" fill="#9AA46B" stroke="#808249" stroke-width="0.4"/>

      <!-- flor principal: tulipán -->
      <g transform="translate(60,56) rotate(-6)">
        <path d="M0,2 C-8.5,-3 -10.5,-15 -7,-25 C-4,-18 -1.5,-12 0,-6 Z" fill="#D8A794" stroke="#C08F7C" stroke-width="0.4"/>
        <path d="M0,2 C8.5,-3 10.5,-15 7,-25 C4,-18 1.5,-12 0,-6 Z" fill="#D8A794" stroke="#C08F7C" stroke-width="0.4"/>
        <path d="M0,3 C-6,-4 -6.5,-17 0,-27 C6.5,-17 6,-4 0,3 Z" fill="#E1B4A1" stroke="#C08F7C" stroke-width="0.45"/>
        <path d="M0,-6 C-2,-12 -2,-19 0,-24 C2,-19 2,-12 0,-6 Z" fill="#EDCBBB" opacity="0.9"/>
      </g>
      <!-- capullo -->
      <g transform="translate(79,92) rotate(24)">
        <path d="M0,1.5 C-5,-2 -6,-10 -3.6,-16 C-1.8,-11 -0.8,-6 0,-3 Z" fill="#A15D66" stroke="#8C4D57" stroke-width="0.35"/>
        <path d="M0,1.5 C5,-2 6,-10 3.6,-16 C1.8,-11 0.8,-6 0,-3 Z" fill="#A15D66" stroke="#8C4D57" stroke-width="0.35"/>
        <path d="M0,2 C-3.4,-3 -3.6,-11 0,-17 C3.6,-11 3.4,-3 0,2 Z" fill="#C08090" stroke="#8C4D57" stroke-width="0.4"/>
      </g>

      <!-- base engrosada donde va el ojal -->
      <circle cx="64.2" cy="166" r="6.5" fill="#808249"/>
      <circle cx="64.2" cy="166" r="6.5" fill="none" stroke="#6E7040" stroke-width="0.5"/>
    </g>
    <!-- ojal -->
    <circle cx="64.2" cy="166" r="2.2" fill="#F3EED7" stroke="#4A1D2B" stroke-width="0.3" stroke-dasharray="0.8 0.8"/>
    <line x1="62.8" y1="166" x2="65.6" y2="166" stroke="#4A1D2B" stroke-width="0.2"/>
    <line x1="64.2" y1="164.6" x2="64.2" y2="167.4" stroke="#4A1D2B" stroke-width="0.2"/>
    <text class="caps" font-size="2.4" letter-spacing="0.8" fill="#808249" x="65" y="184" text-anchor="middle">corte a contorno · 2 mm de margen</text>
  </svg>
</div>
</body>
</html>
