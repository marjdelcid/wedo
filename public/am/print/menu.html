<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Menú · Marjorie & André</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&family=Marcellus+SC&family=Marcellus&family=EB+Garamond:ital@0;1&display=swap">
<style>
  /* =====================================================================
     Menú de 3 hojas troqueladas unidas por ojal metálico en la base
     (giran en abanico) + borla verde oliva. Paleta: verdes A&M
     (oliva 808249, verde cala B9C287, salvia A9AE8F, salvia pálida DFD6A4,
     verde noche 1E2113) con dorado aceituna 9A8B4F de acento.
       Hoja 1 · óvalo grande con el menú
       Hoja 2 · óvalo de rayas con TODO el contenido dentro del círculo
       Hoja 3 · flor troquelada a contorno
     Página: 130 × 190 mm por hoja. Punteado oliva = troquel.
     El círculo pequeño con cruz es el OJAL (Ø 4 mm) en las tres hojas.
     Imprimir al 100%, sin márgenes, cartulina 300 g.
     ===================================================================== */
  @page{size:130mm 190mm; margin:0;}
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:#666;}
  .page{width:130mm; height:190mm; position:relative; overflow:hidden; page-break-after:always; margin:0 auto; background:#fff;}
  @media screen{ .page{margin:10mm auto; box-shadow:0 6px 30px rgba(0,0,0,.4);} }
  svg{display:block; width:130mm; height:190mm;}
  .script{font-family:'Monsieur La Doulaise',cursive;}
  .caps{font-family:'Marcellus SC',serif; text-transform:uppercase;}
  .body-it{font-family:'EB Garamond',serif; font-style:italic;}
  @media print{ html,body{background:#fff;} .page{box-shadow:none; margin:0;} .noprint{display:none;} }
  .noprint{position:fixed; top:8px; left:50%; transform:translateX(-50%); background:#231712; color:#F7F0E5; font:12px/1.5 system-ui; padding:8px 14px; border-radius:10px; z-index:99; max-width:92vw; text-align:center;}
</style>
</head>
<body>
<div class="noprint">Menú de 3 hojas que giran unidas por un ojal Ø 4 mm en la base (+ borla verde oliva) · 130×190 mm c/u · Imprimir al 100%, sin márgenes, cartulina 300 g · Punteado oliva = troquel · La flor se corta a contorno con 2 mm de margen</div>

<!-- HOJA 1 · MENÚ (óvalo grande) -->
<div class="page">
  <svg viewBox="0 0 130 190" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="lino1" patternUnits="userSpaceOnUse" width="130" height="190">
        <image href="/am/tex/lino.webp" x="0" y="0" width="130" height="190" preserveAspectRatio="xMidYMid slice"/>
      </pattern>
    </defs>
    <!-- silueta con sangrado y troquel -->
    <ellipse cx="65" cy="95" rx="54" ry="85" fill="#1E2113"/>
    
    <ellipse cx="65" cy="95" rx="51" ry="82" fill="none" stroke="#DFD6A4" stroke-width="0.25" stroke-dasharray="1.6 1.6"/>
    <ellipse cx="65" cy="95" rx="46.5" ry="77.5" fill="none" stroke="#C39B45" stroke-width="0.35"/>

    <text class="script" font-size="16" fill="#F3EED7" x="65" y="42" text-anchor="middle">Menú</text>

    <text class="caps" font-size="3.1" letter-spacing="1.2" fill="#DFD6A4" x="65" y="55" text-anchor="middle">Entrada</text>
    <text class="body-it" font-size="4.2" fill="#F3EED7" x="65" y="61" text-anchor="middle">Kimbap</text>
    <text class="body-it" font-size="2.9" fill="#B9C287" x="65" y="65.4" text-anchor="middle">rollo coreano de arroz y alga marina con huevo, zanahoria,</text>
    <text class="body-it" font-size="2.9" fill="#B9C287" x="65" y="69.2" text-anchor="middle">rábano encurtido y jamón, con sésamo tostado</text>
    <text class="body-it" font-size="4.2" fill="#F3EED7" x="65" y="76.5" text-anchor="middle">Wantan</text>
    <text class="body-it" font-size="2.9" fill="#B9C287" x="65" y="80.9" text-anchor="middle">de camarón en salsa de tamarindo picante</text>
    <text class="body-it" font-size="2.9" fill="#B9C287" x="65" y="84.7" text-anchor="middle">de lomito con jengibre y cebollín</text>

    <line x1="57" y1="91.5" x2="73" y2="91.5" stroke="#C39B45" stroke-width="0.3"/>

    <text class="caps" font-size="3.1" letter-spacing="1.2" fill="#DFD6A4" x="65" y="98.5" text-anchor="middle">Plato fuerte</text>
    <text class="body-it" font-size="4.2" fill="#F3EED7" x="65" y="104.5" text-anchor="middle">Bibimbap</text>
    <text class="body-it" font-size="2.9" fill="#B9C287" x="65" y="108.9" text-anchor="middle">arroz al vapor, vegetales salteados, lomito marinado</text>
    <text class="body-it" font-size="2.9" fill="#B9C287" x="65" y="112.7" text-anchor="middle">y huevo frito, con salsa gochujang aparte</text>
    <text class="body-it" font-size="4.2" fill="#F3EED7" x="65" y="119.8" text-anchor="middle">Fideo de arroz</text>
    <text class="body-it" font-size="2.9" fill="#B9C287" x="65" y="124.2" text-anchor="middle">con cha siu y salsa de naranja con miso</text>

    <line x1="57" y1="130.5" x2="73" y2="130.5" stroke="#C39B45" stroke-width="0.3"/>

    <text class="caps" font-size="3.1" letter-spacing="1.2" fill="#DFD6A4" x="65" y="137.5" text-anchor="middle">Estación de mini postres</text>
    <text class="body-it" font-size="3.3" fill="#F3EED7" x="65" y="142.6" text-anchor="middle">sabayón con frutos rojos · tiramisú</text>
    <text class="body-it" font-size="3.3" fill="#F3EED7" x="65" y="147" text-anchor="middle">churros con dulce de leche</text>
    <text class="body-it" font-size="3.3" fill="#F3EED7" x="65" y="151.4" text-anchor="middle">hotteok de azúcar moreno y canela</text>

    <path id="mfoot" d="M 35,143.3 A 42,69 0 0 0 95,143.3" fill="none"/>
    <text class="caps" font-size="2.4" letter-spacing="0.8" fill="#C39B45"><textPath href="#mfoot" startOffset="50%" text-anchor="middle">Marjorie &amp; André · 24.10.2026</textPath></text>

    <!-- ojal -->
    <circle cx="65" cy="168" r="2.2" fill="none" stroke="#DFD6A4" stroke-width="0.3" stroke-dasharray="0.8 0.8"/>
    <line x1="63.6" y1="168" x2="66.4" y2="168" stroke="#DFD6A4" stroke-width="0.2"/>
    <line x1="65" y1="166.6" x2="65" y2="169.4" stroke="#DFD6A4" stroke-width="0.2"/>
  </svg>
</div>

<!-- HOJA 2 · MONOGRAMA (rayas; todo el contenido dentro del círculo) -->
<div class="page">
  <svg viewBox="0 0 130 190" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="rayas" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(35)">
        <rect width="4" height="4" fill="#F3EED7"/>
        <rect x="0" width="1.5" height="4" fill="#E4DFBB"/>
      </pattern>
    </defs>
    <ellipse cx="65" cy="102" rx="45" ry="69" fill="url(#rayas)"/>
    <ellipse cx="65" cy="102" rx="42" ry="66" fill="none" stroke="#808249" stroke-width="0.25" stroke-dasharray="1.6 1.6"/>

    <!-- círculo único con todo el contenido -->
    <circle cx="65" cy="96" r="34" fill="#F3EED7"/>
    <circle cx="65" cy="96" r="34" fill="none" stroke="#808249" stroke-width="0.5"/>
    <circle cx="65" cy="96" r="31.5" fill="none" stroke="#C39B45" stroke-width="0.3"/>
    <image href="/am/logo/mono-dorado.png" x="49" y="66" width="32" height="32" preserveAspectRatio="xMidYMid meet"/>
    <text class="caps" font-size="2.7" letter-spacing="1.2" fill="#DFD6A4" x="65" y="107" text-anchor="middle">El Mayab · Guatemala</text>
    <text class="body-it" font-size="3.3" fill="#4A4232" x="65" y="113.5" text-anchor="middle">Gracias por acompañarnos</text>
    <text class="caps" font-size="2.4" letter-spacing="1" fill="#9A8B4F" x="65" y="121" text-anchor="middle">24 · 10 · 26</text>

    <!-- ojal -->
    <circle cx="65" cy="158" r="2.2" fill="none" stroke="#808249" stroke-width="0.3" stroke-dasharray="0.8 0.8"/>
    <line x1="63.6" y1="158" x2="66.4" y2="158" stroke="#808249" stroke-width="0.2"/>
    <line x1="65" y1="156.6" x2="65" y2="159.4" stroke="#808249" stroke-width="0.2"/>
  </svg>
</div>

<!-- HOJA 3 · FLOR (cala en verdes y crema, corte a contorno) -->
<div class="page">
  <svg viewBox="0 0 130 190" xmlns="http://www.w3.org/2000/svg">
    <g stroke-linejoin="round" stroke-linecap="round">
      <!-- tallo principal hasta el ojal -->
      <path d="M64,168 C62,140 60,110 58,84 C57.4,74 57.8,64 60,56" fill="none" stroke="#808249" stroke-width="3.6"/>
      <!-- tallo del capullo -->
      <path d="M63.4,120 C70,110 76,101 79,92" fill="none" stroke="#808249" stroke-width="2.6"/>
      <!-- hoja grande izquierda -->
      <path d="M62.8,150 C48,138 40,120 41,100 C52,112 60,126 63.6,142 Z" fill="#B9C287" stroke="#9AA46B" stroke-width="0.5"/>
      <!-- hoja derecha envolvente -->
      <path d="M63.2,146 C78,136 86,120 85,100 C74,110 66.5,124 63,140 Z" fill="#A9AE8F" stroke="#8E9370" stroke-width="0.5"/>
      <!-- hoja pequeña baja -->
      <path d="M63.8,160 C55,155 50,147 48.5,138 C56,142 61.5,149 63.8,156 Z" fill="#9AA46B" stroke="#808249" stroke-width="0.4"/>

      <!-- flor principal: cala crema -->
      <g transform="translate(60,56) rotate(-6)">
        <path d="M0,2 C-8.5,-3 -10.5,-15 -7,-25 C-4,-18 -1.5,-12 0,-6 Z" fill="#DFD6A4" stroke="#A9AE8F" stroke-width="0.4"/>
        <path d="M0,2 C8.5,-3 10.5,-15 7,-25 C4,-18 1.5,-12 0,-6 Z" fill="#DFD6A4" stroke="#A9AE8F" stroke-width="0.4"/>
        <path d="M0,3 C-6,-4 -6.5,-17 0,-27 C6.5,-17 6,-4 0,3 Z" fill="#F3EED7" stroke="#A9AE8F" stroke-width="0.45"/>
        <path d="M0,-8 C-1.2,-13 -1.2,-19 0,-23.5 C1.2,-19 1.2,-13 0,-8 Z" fill="#C39B45" opacity="0.85"/>
      </g>
      <!-- capullo verde -->
      <g transform="translate(79,92) rotate(24)">
        <path d="M0,1.5 C-5,-2 -6,-10 -3.6,-16 C-1.8,-11 -0.8,-6 0,-3 Z" fill="#9AA46B" stroke="#808249" stroke-width="0.35"/>
        <path d="M0,1.5 C5,-2 6,-10 3.6,-16 C1.8,-11 0.8,-6 0,-3 Z" fill="#9AA46B" stroke="#808249" stroke-width="0.35"/>
        <path d="M0,2 C-3.4,-3 -3.6,-11 0,-17 C3.6,-11 3.4,-3 0,2 Z" fill="#B9C287" stroke="#808249" stroke-width="0.4"/>
      </g>

      <!-- base engrosada donde va el ojal -->
      <circle cx="64.2" cy="166" r="6.5" fill="#808249"/>
      <circle cx="64.2" cy="166" r="6.5" fill="none" stroke="#6E7040" stroke-width="0.5"/>
    </g>
    <!-- ojal -->
    <circle cx="64.2" cy="166" r="2.2" fill="#F3EED7" stroke="#1E2113" stroke-width="0.3" stroke-dasharray="0.8 0.8"/>
    <line x1="62.8" y1="166" x2="65.6" y2="166" stroke="#1E2113" stroke-width="0.2"/>
    <line x1="64.2" y1="164.6" x2="64.2" y2="167.4" stroke="#1E2113" stroke-width="0.2"/>
    <text class="caps" font-size="2.4" letter-spacing="0.8" fill="#808249" x="65" y="184" text-anchor="middle">corte a contorno · 2 mm de margen</text>
  </svg>
</div>
</body>
</html>
