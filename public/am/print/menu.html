<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Menú · Marjorie & André</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&family=Pinyon+Script&family=Marcellus+SC&family=Marcellus&family=EB+Garamond:ital@0;1&display=swap">
<style>
  /* =====================================================================
     Menú de 3 hojas troqueladas unidas por ojal metálico en la base
     (giran en abanico) + borla verde oliva. Según el Brand Book A&M:
       Hoja 1 · el MENÚ: algodón crema, tinta malva única, etiquetas oliva
                (lockup: script «el» + serif MENÚ, centrados)
       Hoja 2 · monograma dorado sobre oliva, con la fecha
       Hoja 3 · tulipán rosa del brandbook, corte a contorno
     Página: 130 × 190 mm por hoja. Punteado = troquel.
     El círculo pequeño con cruz es el OJAL (Ø 4 mm) en las tres hojas.
     Imprimir al 100%, sin márgenes, cartulina 300 g.
     ===================================================================== */
  @font-face{font-family:'Vogue'; src:url('/am/fonts/Vogue.ttf') format('truetype');}
  @page{size:130mm 190mm; margin:0;}
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:#666;}
  .page{width:130mm; height:190mm; position:relative; overflow:hidden; page-break-after:always; margin:0 auto; background:#fff;}
  @media screen{ .page{margin:10mm auto; box-shadow:0 6px 30px rgba(0,0,0,.4);} }
  svg{display:block; width:130mm; height:190mm;}
  .script{font-family:'Monsieur La Doulaise',cursive;}
  .pin{font-family:'Pinyon Script',cursive;}
  .vg{font-family:'Vogue','Bodoni Moda',serif; text-transform:uppercase;}
  .caps{font-family:'Marcellus SC',serif; text-transform:uppercase;}
  .body-it{font-family:'EB Garamond',serif; font-style:italic;}
  @media print{ html,body{background:#fff;} .page{box-shadow:none; margin:0;} .noprint{display:none;} }
  .noprint{position:fixed; top:8px; left:50%; transform:translateX(-50%); background:#231712; color:#F7F0E5; font:12px/1.5 system-ui; padding:8px 14px; border-radius:10px; z-index:99; max-width:92vw; text-align:center;}
</style>
</head>
<body>
<div class="noprint">Menú de 3 hojas que giran unidas por un ojal Ø 4 mm en la base (+ borla verde oliva) · 130×190 mm c/u · Imprimir al 100%, sin márgenes, cartulina 300 g · Punteado = troquel · La flor se corta a contorno con 2 mm de margen</div>

<!-- HOJA 1 · el MENÚ (algodón crema · tinta malva única · etiquetas oliva) -->
<div class="page">
  <svg viewBox="0 0 130 190" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="lino1" patternUnits="userSpaceOnUse" width="130" height="190">
        <image href="/am/tex/lino.webp" x="0" y="0" width="130" height="190" preserveAspectRatio="xMidYMid slice"/>
      </pattern>
    </defs>
    <!-- silueta con sangrado, troquel y marco interior malva (como el marco del brandbook) -->
    <ellipse cx="65" cy="95" rx="54" ry="85" fill="url(#lino1)"/>
    <ellipse cx="65" cy="95" rx="54" ry="85" fill="#F3EED7" opacity="0.6"/>
    <ellipse cx="65" cy="95" rx="51" ry="82" fill="none" stroke="#808249" stroke-width="0.25" stroke-dasharray="1.6 1.6"/>
    <ellipse cx="65" cy="95" rx="46.5" ry="77.5" fill="none" stroke="#A15D66" stroke-width="0.3" opacity="0.4"/>

    <!-- lockup del brandbook: icono + «el» + MENÚ -->
    <text class="script" font-size="16" fill="#A15D66" x="65" y="45" text-anchor="middle">Menú</text>
    <text class="caps" font-size="2.8" letter-spacing="1.1" fill="#808249" x="65" y="57.5" text-anchor="middle">Cena · 24 de octubre de 2026</text>
    <line x1="58" y1="62.5" x2="72" y2="62.5" stroke="#A15D66" stroke-width="0.3" opacity="0.5"/>

    <text class="caps" font-size="3" letter-spacing="1.2" fill="#808249" x="65" y="70" text-anchor="middle">Entrada</text>
    <text class="body-it" font-size="4.2" fill="#A15D66" x="65" y="75.8" text-anchor="middle">Kimbap</text>
    <text class="body-it" font-size="2.9" fill="#A15D66" opacity="0.8" x="65" y="80" text-anchor="middle">rollo coreano de arroz y alga marina con huevo, zanahoria,</text>
    <text class="body-it" font-size="2.9" fill="#A15D66" opacity="0.8" x="65" y="83.8" text-anchor="middle">rábano encurtido y jamón, con sésamo tostado</text>
    <text class="body-it" font-size="4.2" fill="#A15D66" x="65" y="90.6" text-anchor="middle">Wantan</text>
    <text class="body-it" font-size="2.9" fill="#A15D66" opacity="0.8" x="65" y="94.8" text-anchor="middle">de camarón en salsa de tamarindo picante</text>
    <text class="body-it" font-size="2.9" fill="#A15D66" opacity="0.8" x="65" y="98.6" text-anchor="middle">de lomito con jengibre y cebollín</text>

    <text class="caps" font-size="3" letter-spacing="1.2" fill="#808249" x="65" y="106.5" text-anchor="middle">Plato fuerte</text>
    <text class="body-it" font-size="4.2" fill="#A15D66" x="65" y="112.3" text-anchor="middle">Bibimbap</text>
    <text class="body-it" font-size="2.9" fill="#A15D66" opacity="0.8" x="65" y="116.5" text-anchor="middle">arroz al vapor, vegetales salteados, lomito marinado</text>
    <text class="body-it" font-size="2.9" fill="#A15D66" opacity="0.8" x="65" y="120.3" text-anchor="middle">y huevo frito, con salsa gochujang aparte</text>
    <text class="body-it" font-size="4.2" fill="#A15D66" x="65" y="127.1" text-anchor="middle">Fideo de arroz</text>
    <text class="body-it" font-size="2.9" fill="#A15D66" opacity="0.8" x="65" y="131.3" text-anchor="middle">con cha siu y salsa de naranja con miso</text>

    <text class="caps" font-size="3" letter-spacing="1.2" fill="#808249" x="65" y="139.2" text-anchor="middle">Estación de mini postres</text>
    <text class="body-it" font-size="3.3" fill="#A15D66" x="65" y="144.3" text-anchor="middle">sabayón con frutos rojos · tiramisú</text>
    <text class="body-it" font-size="3.3" fill="#A15D66" x="65" y="148.7" text-anchor="middle">churros con dulce de leche</text>
    <text class="body-it" font-size="3.3" fill="#A15D66" x="65" y="153.1" text-anchor="middle">hotteok de azúcar moreno y canela</text>

    <text class="caps" font-size="2.4" letter-spacing="0.8" fill="#808249" x="65" y="160.5" text-anchor="middle">Marjorie &amp; André</text>

    <!-- ojal -->
    <circle cx="65" cy="168" r="2.2" fill="none" stroke="#808249" stroke-width="0.3" stroke-dasharray="0.8 0.8"/>
    <line x1="63.6" y1="168" x2="66.4" y2="168" stroke="#808249" stroke-width="0.2"/>
    <line x1="65" y1="166.6" x2="65" y2="169.4" stroke="#808249" stroke-width="0.2"/>
  </svg>
</div>

<!-- HOJA 2 · MONOGRAMA (oliva · logo dorado · fecha) -->
<div class="page">
  <svg viewBox="0 0 130 190" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="65" cy="102" rx="45" ry="69" fill="#808249"/>
    <ellipse cx="65" cy="102" rx="42" ry="66" fill="none" stroke="#DFD6A4" stroke-width="0.25" stroke-dasharray="1.6 1.6"/>
    <ellipse cx="65" cy="102" rx="38" ry="62" fill="none" stroke="#C39B45" stroke-width="0.35"/>

    <image href="/am/logo/mono-dorado.png" x="45" y="66" width="40" height="40" preserveAspectRatio="xMidYMid meet"/>
    <line x1="57" y1="115" x2="73" y2="115" stroke="#C39B45" stroke-width="0.3"/>
    <text class="caps" font-size="3.4" letter-spacing="1.6" fill="#F3EED7" x="65" y="123" text-anchor="middle">24 · 10 · 2026</text>

    <!-- ojal -->
    <circle cx="65" cy="158" r="2.2" fill="none" stroke="#DFD6A4" stroke-width="0.3" stroke-dasharray="0.8 0.8"/>
    <line x1="63.6" y1="158" x2="66.4" y2="158" stroke="#DFD6A4" stroke-width="0.2"/>
    <line x1="65" y1="156.6" x2="65" y2="159.4" stroke="#DFD6A4" stroke-width="0.2"/>
  </svg>
</div>

<!-- HOJA 3 · TULIPÁN ROSA del brandbook (corte a contorno) -->
<div class="page">
  <svg viewBox="0 0 130 190" xmlns="http://www.w3.org/2000/svg">
    <g stroke-linejoin="round" stroke-linecap="round">
      <!-- tallo principal hasta el ojal -->
      <path d="M64,168 C62,140 60,110 58,84 C57.4,74 57.8,64 60,56" fill="none" stroke="#808249" stroke-width="3.6"/>
      <!-- tallo del capullo -->
      <path d="M63.4,120 C70,110 76,101 79,92" fill="none" stroke="#808249" stroke-width="2.6"/>
      <!-- hoja grande izquierda -->
      <path d="M62.8,150 C48,138 40,120 41,100 C52,112 60,126 63.6,142 Z" fill="#B9C287" stroke="#9AA46B" stroke-width="0.5"/>
      <!-- hoja derecha envolvente -->
      <path d="M63.2,146 C78,136 86,120 85,100 C74,110 66.5,124 63,140 Z" fill="#A9AE8F" stroke="#8E9370" stroke-width="0.5"/>
      <!-- hoja pequeña baja -->
      <path d="M63.8,160 C55,155 50,147 48.5,138 C56,142 61.5,149 63.8,156 Z" fill="#9AA46B" stroke="#808249" stroke-width="0.4"/>

      <!-- flor principal: tulipán rosa -->
      <g transform="translate(60,56) rotate(-6)">
        <path d="M0,2 C-8.5,-3 -10.5,-15 -7,-25 C-4,-18 -1.5,-12 0,-6 Z" fill="#D8A794" stroke="#B06A73" stroke-width="0.4"/>
        <path d="M0,2 C8.5,-3 10.5,-15 7,-25 C4,-18 1.5,-12 0,-6 Z" fill="#D8A794" stroke="#B06A73" stroke-width="0.4"/>
        <path d="M0,3 C-6,-4 -6.5,-17 0,-27 C6.5,-17 6,-4 0,3 Z" fill="#E1B4A1" stroke="#B06A73" stroke-width="0.45"/>
        <path d="M0,-6 C-2,-12 -2,-19 0,-24 C2,-19 2,-12 0,-6 Z" fill="#EDCBBB" opacity="0.9"/>
      </g>
      <!-- capullo malva -->
      <g transform="translate(79,92) rotate(24)">
        <path d="M0,1.5 C-5,-2 -6,-10 -3.6,-16 C-1.8,-11 -0.8,-6 0,-3 Z" fill="#A15D66" stroke="#8C4E57" stroke-width="0.35"/>
        <path d="M0,1.5 C5,-2 6,-10 3.6,-16 C1.8,-11 0.8,-6 0,-3 Z" fill="#A15D66" stroke="#8C4E57" stroke-width="0.35"/>
        <path d="M0,2 C-3.4,-3 -3.6,-11 0,-17 C3.6,-11 3.4,-3 0,2 Z" fill="#C08090" stroke="#8C4E57" stroke-width="0.4"/>
      </g>

      <!-- base engrosada donde va el ojal -->
      <circle cx="64.2" cy="166" r="6.5" fill="#808249"/>
      <circle cx="64.2" cy="166" r="6.5" fill="none" stroke="#6E7040" stroke-width="0.5"/>
    </g>
    <!-- ojal -->
    <circle cx="64.2" cy="166" r="2.2" fill="#F3EED7" stroke="#1E2113" stroke-width="0.3" stroke-dasharray="0.8 0.8"/>
    <line x1="62.8" y1="166" x2="65.6" y2="166" stroke="#1E2113" stroke-width="0.2"/>
    <line x1="64.2" y1="164.6" x2="64.2" y2="167.4" stroke="#1E2113" stroke-width="0.2"/>
    <text class="caps" font-size="2.4" letter-spacing="0.8" fill="#808249" x="65" y="184" text-anchor="middle">corte a contorno · 2 mm de margen</text>
  </svg>
</div>
</body>
</html>
