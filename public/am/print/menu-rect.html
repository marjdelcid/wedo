<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Menú rectangular · Marjorie & André</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&family=Marcellus+SC&family=Marcellus&family=EB+Garamond:ital@0;1&display=swap">
<style>
  /* =====================================================================
     Menú de mesa rectangular vertical · formato DL 99 × 210 mm
     + 3 mm de sangrado por lado (página 105 × 216 mm).
     Fondo algodón crema con lino; tinta verde noche y oliva.
     La zona bajo la leyenda queda libre para el sello.
     Imprimir al 100%, sin márgenes, cartulina 300 g. Corte recto.
     ===================================================================== */
  @page{size:105mm 216mm; margin:0;}
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:#666;}
  .page{width:105mm; height:216mm; position:relative; overflow:hidden; margin:0 auto; background:#fff;}
  @media screen{ .page{margin:10mm auto; box-shadow:0 6px 30px rgba(0,0,0,.4);} }
  svg{display:block; width:105mm; height:216mm;}
  .script{font-family:'Monsieur La Doulaise',cursive;}
  .caps{font-family:'Marcellus SC',serif; text-transform:uppercase;}
  .body-it{font-family:'EB Garamond',serif; font-style:italic;}
  @media print{ html,body{background:#fff;} .page{box-shadow:none; margin:0;} .noprint{display:none;} }
  .noprint{position:fixed; top:8px; left:50%; transform:translateX(-50%); background:#231712; color:#F7F0E5; font:12px/1.5 system-ui; padding:8px 14px; border-radius:10px; z-index:99; max-width:92vw; text-align:center;}
</style>
</head>
<body>
<div class="noprint">Menú rectangular DL 99×210 mm + 3 mm de sangrado · Imprimir al 100%, sin márgenes, cartulina 300 g · Corte recto (la línea punteada es la guía) · El espacio inferior queda libre para el sello</div>

<div class="page">
  <svg viewBox="0 0 105 216" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="lino" patternUnits="userSpaceOnUse" width="105" height="216">
        <image href="/am/tex/lino.webp" x="0" y="0" width="105" height="216" preserveAspectRatio="xMidYMid slice"/>
      </pattern>
    </defs>
    <!-- fondo a sangre + guía de corte -->
    <rect x="0" y="0" width="105" height="216" fill="url(#lino)"/>
    <rect x="0" y="0" width="105" height="216" fill="#F3EED7" opacity="0.6"/>
    <rect x="3" y="3" width="99" height="210" fill="none" stroke="#808249" stroke-width="0.25" stroke-dasharray="1.6 1.6"/>
    <!-- marco interior doble -->
    <rect x="8.5" y="8.5" width="88" height="199" fill="none" stroke="#808249" stroke-width="0.35"/>
    <rect x="10.3" y="10.3" width="84.4" height="195.4" fill="none" stroke="#808249" stroke-width="0.25" opacity="0.5"/>

    <text class="script" font-size="16" fill="#1E2113" x="52.5" y="38" text-anchor="middle">Menú</text>
    <line x1="45" y1="45.5" x2="60" y2="45.5" stroke="#808249" stroke-width="0.3" opacity="0.7"/>

    <text class="caps" font-size="3.1" letter-spacing="1.3" fill="#808249" x="52.5" y="57" text-anchor="middle">Entrée</text>
    <text class="body-it" font-size="4.4" fill="#1E2113" x="52.5" y="64" text-anchor="middle">Kimbap</text>
    <text class="body-it" font-size="2.9" fill="#808249" x="52.5" y="68.5" text-anchor="middle">rollo coreano de arroz y alga marina con huevo,</text>
    <text class="body-it" font-size="2.9" fill="#808249" x="52.5" y="72.3" text-anchor="middle">zanahoria, rábano encurtido y jamón, con sésamo tostado</text>
    <circle cx="52.5" cy="77.8" r="2.3" fill="none" stroke="#808249" stroke-width="0.3"/>
    <text class="caps" font-size="2.5" fill="#808249" x="52.5" y="78.7" text-anchor="middle">M</text>

    <text class="body-it" font-size="4.4" fill="#1E2113" x="52.5" y="87.5" text-anchor="middle">Wantan</text>
    <text class="body-it" font-size="2.9" fill="#808249" x="52.5" y="92" text-anchor="middle">de camarón en salsa de tamarindo picante</text>
    <text class="body-it" font-size="2.9" fill="#808249" x="52.5" y="95.8" text-anchor="middle">de lomito con jengibre y cebollín</text>
    <circle cx="52.5" cy="101.3" r="2.3" fill="none" stroke="#808249" stroke-width="0.3"/>
    <text class="caps" font-size="2.5" fill="#808249" x="52.5" y="102.2" text-anchor="middle">A</text>

    <line x1="45" y1="108.5" x2="60" y2="108.5" stroke="#808249" stroke-width="0.3" opacity="0.7"/>

    <text class="caps" font-size="3.1" letter-spacing="1.3" fill="#808249" x="52.5" y="116.5" text-anchor="middle">Main</text>
    <text class="body-it" font-size="4.4" fill="#1E2113" x="52.5" y="123.5" text-anchor="middle">Bibimbap</text>
    <text class="body-it" font-size="2.9" fill="#808249" x="52.5" y="128" text-anchor="middle">arroz al vapor, vegetales salteados, lomito marinado</text>
    <text class="body-it" font-size="2.9" fill="#808249" x="52.5" y="131.8" text-anchor="middle">y huevo frito, con salsa gochujang aparte</text>
    <circle cx="52.5" cy="137.3" r="2.3" fill="none" stroke="#808249" stroke-width="0.3"/>
    <text class="caps" font-size="2.5" fill="#808249" x="52.5" y="138.2" text-anchor="middle">M</text>

    <text class="body-it" font-size="4.4" fill="#1E2113" x="52.5" y="147" text-anchor="middle">Fideo de arroz</text>
    <text class="body-it" font-size="2.9" fill="#808249" x="52.5" y="151.5" text-anchor="middle">con cha siu y salsa de naranja con miso</text>
    <circle cx="52.5" cy="157" r="2.3" fill="none" stroke="#808249" stroke-width="0.3"/>
    <text class="caps" font-size="2.5" fill="#808249" x="52.5" y="157.9" text-anchor="middle">A</text>

    <line x1="45" y1="164" x2="60" y2="164" stroke="#808249" stroke-width="0.3" opacity="0.7"/>

    <text class="caps" font-size="3.1" letter-spacing="1.3" fill="#808249" x="52.5" y="172" text-anchor="middle">Dessert</text>
    <text class="body-it" font-size="3.4" fill="#1E2113" x="52.5" y="177.8" text-anchor="middle">sabayón con frutos rojos · tiramisú</text>
    <text class="body-it" font-size="3.4" fill="#1E2113" x="52.5" y="182.6" text-anchor="middle">churros con dulce de leche</text>
    <text class="body-it" font-size="3.4" fill="#1E2113" x="52.5" y="187.4" text-anchor="middle">hotteok de azúcar moreno y canela</text>
    <circle cx="49.5" cy="192.9" r="2.3" fill="none" stroke="#808249" stroke-width="0.3"/>
    <text class="caps" font-size="2.5" fill="#808249" x="49.5" y="193.8" text-anchor="middle">A</text>
    <circle cx="55.5" cy="192.9" r="2.3" fill="none" stroke="#808249" stroke-width="0.3"/>
    <text class="caps" font-size="2.5" fill="#808249" x="55.5" y="193.8" text-anchor="middle">M</text>

    <!-- leyenda centrada; debajo queda el espacio para el sello -->
    <g>
      <circle cx="13.5" cy="201.1" r="2" fill="none" stroke="#808249" stroke-width="0.28"/>
      <text class="caps" font-size="2.2" fill="#808249" x="13.5" y="201.9" text-anchor="middle">A</text>
      <text class="caps" font-size="2" letter-spacing="0.35" fill="#808249" x="16.6" y="201.8">elección de André</text>
      <circle cx="54.4" cy="201.1" r="2" fill="none" stroke="#808249" stroke-width="0.28"/>
      <text class="caps" font-size="2.2" fill="#808249" x="54.4" y="201.9" text-anchor="middle">M</text>
      <text class="caps" font-size="2" letter-spacing="0.35" fill="#808249" x="57.5" y="201.8">elección de Marjorie</text>
    </g>
  </svg>
</div>
</body>
</html>
