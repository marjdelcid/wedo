<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Menú rectangular · Marjorie & André</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&family=Marcellus+SC&family=Marcellus&family=EB+Garamond:ital@0;1&display=swap">
<style>
  /* =====================================================================
     Menú de mesa rectangular vertical · formato DL 99 × 210 mm
     + 3 mm de sangrado por lado (página 105 × 216 mm).
     Fondo blanco; tinta mauve oscuro (vino profundo) y oliva.
     Columna balanceada: mismo aire arriba (título) y abajo (monograma).
     Imprimir al 100%, sin márgenes, cartulina 300 g. Corte recto.
     ===================================================================== */
  @page{size:105mm 216mm; margin:0;}
  *{box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  html,body{margin:0; padding:0; background:#666;}
  .page{width:105mm; height:216mm; position:relative; overflow:hidden; margin:0 auto; background:#fff;}
  @media screen{ .page{margin:10mm auto; box-shadow:0 6px 30px rgba(0,0,0,.4);} }
  svg{display:block; width:105mm; height:216mm;}
  .script{font-family:'Monsieur La Doulaise',cursive;}
  .caps{font-family:'Marcellus SC',serif; text-transform:uppercase;}
  .body-it{font-family:'EB Garamond',serif; font-style:italic;}
  @media print{ html,body{background:#fff;} .page{box-shadow:none; margin:0;} .noprint{display:none;} }
  .noprint{position:fixed; top:8px; left:50%; transform:translateX(-50%); background:#231712; color:#F7F0E5; font:12px/1.5 system-ui; padding:8px 14px; border-radius:10px; z-index:99; max-width:92vw; text-align:center;}
</style>
</head>
<body>
<div class="noprint">Menú rectangular DL 99×210 mm + 3 mm de sangrado · Imprimir al 100%, sin márgenes, cartulina 300 g · Corte recto (la línea punteada es la guía)</div>

<div class="page">
  <svg viewBox="0 0 105 216" xmlns="http://www.w3.org/2000/svg">
    <!-- fondo blanco a sangre + guía de corte -->
    <rect x="0" y="0" width="105" height="216" fill="#FFFFFF"/>
    <rect x="3" y="3" width="99" height="210" fill="none" stroke="#808249" stroke-width="0.25" stroke-dasharray="1.6 1.6"/>
    <!-- marco interior doble -->
    <rect x="8.5" y="8.5" width="88" height="199" fill="none" stroke="#808249" stroke-width="0.35"/>
    <rect x="10.3" y="10.3" width="84.4" height="195.4" fill="none" stroke="#808249" stroke-width="0.25" opacity="0.5"/>

    <text class="script" font-size="15" fill="#4A1D2B" x="52.5" y="32.5" text-anchor="middle">Menú</text>
    <line x1="45" y1="40" x2="60" y2="40" stroke="#808249" stroke-width="0.3" opacity="0.7"/>

    <text class="caps" font-size="3.1" letter-spacing="1.3" fill="#808249" x="52.5" y="51" text-anchor="middle">Entrée</text>
    <text class="body-it" font-size="4.4" fill="#4A1D2B" x="52.5" y="57.8" text-anchor="middle">Kimbap</text>
    <text class="body-it" font-size="2.9" fill="#808249" x="52.5" y="62.3" text-anchor="middle">rollo coreano de arroz y alga marina con huevo,</text>
    <text class="body-it" font-size="2.9" fill="#808249" x="52.5" y="66.1" text-anchor="middle">zanahoria, rábano encurtido y jamón, con sésamo tostado</text>
    <circle cx="52.5" cy="71.2" r="1.8" fill="none" stroke="#808249" stroke-width="0.28"/>
    <text class="caps" font-size="1.9" fill="#808249" x="52.5" y="71.9" text-anchor="middle">M</text>

    <text class="body-it" font-size="4.4" fill="#4A1D2B" x="52.5" y="80.6" text-anchor="middle">Wantan</text>
    <text class="body-it" font-size="2.9" fill="#808249" x="52.5" y="85.1" text-anchor="middle">de camarón en salsa de tamarindo picante</text>
    <text class="body-it" font-size="2.9" fill="#808249" x="52.5" y="88.9" text-anchor="middle">de lomito con jengibre y cebollín</text>
    <circle cx="52.5" cy="94" r="1.8" fill="none" stroke="#808249" stroke-width="0.28"/>
    <text class="caps" font-size="1.9" fill="#808249" x="52.5" y="94.7" text-anchor="middle">A</text>

    <line x1="45" y1="101" x2="60" y2="101" stroke="#808249" stroke-width="0.3" opacity="0.7"/>

    <text class="caps" font-size="3.1" letter-spacing="1.3" fill="#808249" x="52.5" y="109" text-anchor="middle">Main</text>
    <text class="body-it" font-size="4.4" fill="#4A1D2B" x="52.5" y="115.8" text-anchor="middle">Bibimbap</text>
    <text class="body-it" font-size="2.9" fill="#808249" x="52.5" y="120.3" text-anchor="middle">arroz al vapor, vegetales salteados, lomito marinado</text>
    <text class="body-it" font-size="2.9" fill="#808249" x="52.5" y="124.1" text-anchor="middle">y huevo frito, con salsa gochujang aparte</text>
    <circle cx="52.5" cy="129.2" r="1.8" fill="none" stroke="#808249" stroke-width="0.28"/>
    <text class="caps" font-size="1.9" fill="#808249" x="52.5" y="129.9" text-anchor="middle">M</text>

    <text class="body-it" font-size="4.4" fill="#4A1D2B" x="52.5" y="138.6" text-anchor="middle">Fideo de arroz</text>
    <text class="body-it" font-size="2.9" fill="#808249" x="52.5" y="143.1" text-anchor="middle">con cha siu y salsa de naranja con miso</text>
    <circle cx="52.5" cy="148.2" r="1.8" fill="none" stroke="#808249" stroke-width="0.28"/>
    <text class="caps" font-size="1.9" fill="#808249" x="52.5" y="148.9" text-anchor="middle">A</text>

    <line x1="45" y1="155" x2="60" y2="155" stroke="#808249" stroke-width="0.3" opacity="0.7"/>

    <text class="caps" font-size="3.1" letter-spacing="1.3" fill="#808249" x="52.5" y="162.5" text-anchor="middle">Dessert bar</text>
    <text class="body-it" font-size="2.8" fill="#808249" x="52.5" y="166.9" text-anchor="middle">para disfrutar en la noche, durante la fiesta</text>
    <text class="body-it" font-size="3.4" fill="#4A1D2B" x="52.5" y="172.6" text-anchor="middle">sabayón con frutos rojos · tiramisú</text>
    <text class="body-it" font-size="3.4" fill="#4A1D2B" x="52.5" y="177.4" text-anchor="middle">churros con dulce de leche</text>
    <text class="body-it" font-size="3.4" fill="#4A1D2B" x="52.5" y="182.2" text-anchor="middle">hotteok de azúcar moreno y canela</text>

    <!-- leyenda centrada -->
    <g>
      <circle cx="19.6" cy="189.9" r="1.7" fill="none" stroke="#808249" stroke-width="0.26"/>
      <text class="caps" font-size="1.9" fill="#808249" x="19.6" y="190.6" text-anchor="middle">A</text>
      <text class="caps" font-size="1.9" letter-spacing="0.35" fill="#808249" x="22.4" y="190.6">André&#8217;s choice</text>
      <circle cx="54.4" cy="189.9" r="1.7" fill="none" stroke="#808249" stroke-width="0.26"/>
      <text class="caps" font-size="1.9" fill="#808249" x="54.4" y="190.6" text-anchor="middle">M</text>
      <text class="caps" font-size="1.9" letter-spacing="0.35" fill="#808249" x="57.2" y="190.6">Marjorie&#8217;s choice</text>
    </g>
    <!-- monograma como colofón, dentro del marco con aire -->
    <image href="/am/logo/mono-dorado.png" x="48.5" y="194.6" width="8" height="8" preserveAspectRatio="xMidYMid meet"/>
  </svg>
</div>
</body>
</html>
