<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Menú rectangular · Marjorie & André</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&family=Marcellus+SC&family=Marcellus&family=EB+Garamond:ital@0;1&display=swap">
<style>
  /* =====================================================================
     Menú de mesa rectangular vertical · formato DL 99 × 210 mm
     + 3 mm de sangrado por lado (página 105 × 216 mm).
     Fondo algodón crema con lino; tinta verde noche y oliva.
     Flor (tulipán) = elección de Marjorie · Hoja de olivo = elección de André.
     La franja inferior (~24 mm) queda libre para el sello.
     Imprimir al 100%, sin márgenes, cartulina 300 g. Corte recto.
     ===================================================================== */
  @page{size:105mm 216mm; margin:0;}
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:#666;}
  .page{width:105mm; height:216mm; position:relative; overflow:hidden; margin:0 auto; background:#fff;}
  @media screen{ .page{margin:10mm auto; box-shadow:0 6px 30px rgba(0,0,0,.4);} }
  svg{display:block; width:105mm; height:216mm;}
  .script{font-family:'Monsieur La Doulaise',cursive;}
  .caps{font-family:'Marcellus SC',serif; text-transform:uppercase;}
  .body-it{font-family:'EB Garamond',serif; font-style:italic;}
  @media print{ html,body{background:#fff;} .page{box-shadow:none; margin:0;} .noprint{display:none;} }
  .noprint{position:fixed; top:8px; left:50%; transform:translateX(-50%); background:#231712; color:#F7F0E5; font:12px/1.5 system-ui; padding:8px 14px; border-radius:10px; z-index:99; max-width:92vw; text-align:center;}
</style>
</head>
<body>
<div class="noprint">Menú rectangular DL 99×210 mm + 3 mm de sangrado · Imprimir al 100%, sin márgenes, cartulina 300 g · Corte recto (la línea punteada es la guía) · La franja inferior queda libre para el sello</div>

<div class="page">
  <svg viewBox="0 0 105 216" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="lino" patternUnits="userSpaceOnUse" width="105" height="216">
        <image href="/am/tex/lino.webp" x="0" y="0" width="105" height="216" preserveAspectRatio="xMidYMid slice"/>
      </pattern>
      <!-- tulipán mini · elección de Marjorie -->
      <g id="flor">
        <path d="M0,2.6 C0.1,1.4 0,0.4 0,-0.4" fill="none" stroke="#808249" stroke-width="0.5" stroke-linecap="round"/>
        <path d="M0,-0.6 C-1.9,-1.5 -2.3,-3.3 -1.6,-4.6 C-0.9,-3.3 -0.4,-2.1 0,-1.2 Z" fill="#D8A794" stroke="#A15D66" stroke-width="0.22"/>
        <path d="M0,-0.6 C1.9,-1.5 2.3,-3.3 1.6,-4.6 C0.9,-3.3 0.4,-2.1 0,-1.2 Z" fill="#D8A794" stroke="#A15D66" stroke-width="0.22"/>
        <path d="M0,-0.4 C-1.4,-1.6 -1.5,-3.7 0,-5 C1.5,-3.7 1.4,-1.6 0,-0.4 Z" fill="#E1B4A1" stroke="#A15D66" stroke-width="0.25"/>
        <path d="M0,1.2 C-1,0.8 -1.5,0.1 -1.7,-0.7 C-0.9,-0.4 -0.3,0.2 0,0.8 Z" fill="#B9C287"/>
        <path d="M0,1.2 C1,0.8 1.5,0.1 1.7,-0.7 C0.9,-0.4 0.3,0.2 0,0.8 Z" fill="#B9C287"/>
      </g>
      <!-- hoja de olivo · elección de André -->
      <g id="hoja">
        <path d="M-0.4,2.6 C-0.1,1 0.3,-0.8 1,-2.6" fill="none" stroke="#808249" stroke-width="0.4" stroke-linecap="round"/>
        <path d="M1,-2.6 C-0.9,-2.4 -2,-3.4 -2.2,-4.9 C-0.3,-5.1 0.9,-4.1 1,-2.6 Z" fill="#B9C287" stroke="#808249" stroke-width="0.25"/>
        <path d="M-0.1,0.2 C-1.6,0.3 -2.5,-0.4 -2.8,-1.6 C-1.3,-1.7 -0.3,-1 -0.1,0.2 Z" fill="#A9AE8F" stroke="#808249" stroke-width="0.22"/>
        <path d="M0.4,-1 C1.8,-1.4 2.8,-1 3.4,0 C2.1,0.5 1,0.1 0.4,-1 Z" fill="#9AA46B" stroke="#808249" stroke-width="0.22"/>
      </g>
    </defs>
    <!-- fondo a sangre + guía de corte -->
    <rect x="0" y="0" width="105" height="216" fill="url(#lino)"/>
    <rect x="0" y="0" width="105" height="216" fill="#F3EED7" opacity="0.6"/>
    <rect x="3" y="3" width="99" height="210" fill="none" stroke="#808249" stroke-width="0.25" stroke-dasharray="1.6 1.6"/>
    <!-- marco interior doble -->
    <rect x="8.5" y="8.5" width="88" height="199" fill="none" stroke="#808249" stroke-width="0.35"/>
    <rect x="10.3" y="10.3" width="84.4" height="195.4" fill="none" stroke="#808249" stroke-width="0.25" opacity="0.5"/>

    <text class="script" font-size="15" fill="#1E2113" x="52.5" y="33" text-anchor="middle">Menú</text>
    <line x1="45" y1="40" x2="60" y2="40" stroke="#808249" stroke-width="0.3" opacity="0.7"/>

    <text class="caps" font-size="3.1" letter-spacing="1.3" fill="#808249" x="52.5" y="50" text-anchor="middle">Entrée</text>
    <text class="body-it" font-size="4.4" fill="#1E2113" x="52.5" y="56.5" text-anchor="middle">Kimbap</text>
    <text class="body-it" font-size="2.9" fill="#808249" x="52.5" y="61" text-anchor="middle">rollo coreano de arroz y alga marina con huevo,</text>
    <text class="body-it" font-size="2.9" fill="#808249" x="52.5" y="64.8" text-anchor="middle">zanahoria, rábano encurtido y jamón, con sésamo tostado</text>
    <use href="#flor" transform="translate(52.5,70.5)"/>

    <text class="body-it" font-size="4.4" fill="#1E2113" x="52.5" y="79.5" text-anchor="middle">Wantan</text>
    <text class="body-it" font-size="2.9" fill="#808249" x="52.5" y="84" text-anchor="middle">de camarón en salsa de tamarindo picante</text>
    <text class="body-it" font-size="2.9" fill="#808249" x="52.5" y="87.8" text-anchor="middle">de lomito con jengibre y cebollín</text>
    <use href="#hoja" transform="translate(52.5,93.3)"/>

    <line x1="45" y1="99.5" x2="60" y2="99.5" stroke="#808249" stroke-width="0.3" opacity="0.7"/>

    <text class="caps" font-size="3.1" letter-spacing="1.3" fill="#808249" x="52.5" y="107" text-anchor="middle">Main</text>
    <text class="body-it" font-size="4.4" fill="#1E2113" x="52.5" y="113.5" text-anchor="middle">Bibimbap</text>
    <text class="body-it" font-size="2.9" fill="#808249" x="52.5" y="118" text-anchor="middle">arroz al vapor, vegetales salteados, lomito marinado</text>
    <text class="body-it" font-size="2.9" fill="#808249" x="52.5" y="121.8" text-anchor="middle">y huevo frito, con salsa gochujang aparte</text>
    <use href="#flor" transform="translate(52.5,127.5)"/>

    <text class="body-it" font-size="4.4" fill="#1E2113" x="52.5" y="136.5" text-anchor="middle">Fideo de arroz</text>
    <text class="body-it" font-size="2.9" fill="#808249" x="52.5" y="141" text-anchor="middle">con cha siu y salsa de naranja con miso</text>
    <use href="#hoja" transform="translate(52.5,146.5)"/>

    <line x1="45" y1="152.5" x2="60" y2="152.5" stroke="#808249" stroke-width="0.3" opacity="0.7"/>

    <text class="caps" font-size="3.1" letter-spacing="1.3" fill="#808249" x="52.5" y="160" text-anchor="middle">Dessert</text>
    <text class="body-it" font-size="3.4" fill="#1E2113" x="52.5" y="165.6" text-anchor="middle">sabayón con frutos rojos · tiramisú</text>
    <text class="body-it" font-size="3.4" fill="#1E2113" x="52.5" y="170.4" text-anchor="middle">churros con dulce de leche</text>
    <text class="body-it" font-size="3.4" fill="#1E2113" x="52.5" y="175.2" text-anchor="middle">hotteok de azúcar moreno y canela</text>
    <use href="#flor" transform="translate(48.5,181)"/>
    <use href="#hoja" transform="translate(56.5,181)"/>

    <!-- leyenda centrada; debajo, franja libre (~24 mm) para el sello -->
    <g>
      <use href="#flor" transform="translate(12.5,187.8) scale(0.8)"/>
      <text class="caps" font-size="2" letter-spacing="0.35" fill="#808249" x="16" y="188.9">elección de Marjorie</text>
      <use href="#hoja" transform="translate(57.5,187.8) scale(0.8)"/>
      <text class="caps" font-size="2" letter-spacing="0.35" fill="#808249" x="61.5" y="188.9">elección de André</text>
    </g>
  </svg>
</div>
</body>
</html>
